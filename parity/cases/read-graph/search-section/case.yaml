# search reports `section`: the Markdown heading path to the first match in
# the snippet, when the snippet excerpts the body. Absent for a title match,
# a frontmatter value, text before the first heading, and a body with no
# headings. A `#` line inside a code fence is not a heading; a closing run
# of `#` is dropped; a shallower heading closes the deeper ones.
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "component", "--title", "Store", "--kind", "service", "--stack", "golang", "--body", "Intro about widgets.\n\n# Design\n\nOverview text.\n\n## Write path ##\n\n```bash\n# zebra is not a heading here\n```\n\n### Locking\n\nWe take a flock on the lockfile before writing.\n\n## Read path\n\nReaders never take the flock.\n"]
- argv: ["add", "component", "--title", "Cache", "--kind", "service", "--body", "Plain prose about eviction, no headings at all.\n"]
- argv: ["search", "lockfile"]
- argv: ["search", "zebra"]
- argv: ["search", "readers"]
- argv: ["search", "widgets"]
- argv: ["search", "golang"]
- argv: ["search", "store"]
- argv: ["search", "eviction"]
- argv: ["search", "--plain", "flock readers"]

# `khub completion SHELL` prints cobra's completion script for one shell; the
# script calls back into the binary as `khub __complete <words…>` at TAB time.
# This replaces completion-command-absent, which pinned `completion` as a usage
# error for Typer parity (add_completion=False). --install-completion stays
# absent: completion-absent still pins it.
#
# The four script steps pin cobra's generated bytes, so a cobra bump that moves
# a script shows up here as a reviewed diff. The __complete steps pin the
# callback protocol: candidates with descriptions, then `:<directive>` on
# stdout, cobra's directive note on stderr. The root listing must carry no
# empty candidate for khub's nameless help command (skipBlankLines), and -C
# completes directories.
steps:
- argv: ["completion"]
- argv: ["completion", "tcsh"]
- argv: ["completion", "bash", "zsh"]
- argv: ["completion", "bash"]
- argv: ["completion", "zsh"]
- argv: ["completion", "fish"]
- argv: ["completion", "powershell"]
- argv: ["__complete", ""]
- argv: ["__complete", "completion", ""]
- argv: ["__complete", "-C", ""]
- argv: ["__complete", "schema", "sh"]
- argv: ["-C", ".", "__complete", "st"]
